spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
server:
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
  forward-headers-strategy: none
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
