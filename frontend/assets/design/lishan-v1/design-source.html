 function miniArticle(){return `<article class="ls-minicard ls-reading"><div>${tag('教学方法','blue')}</div><h2>如何引导学生<br>进行整本书阅读</h2><small>力山学堂 · 2026-10-08</small>${cover('阅读是一场<br>持续的发现','jade')}<p>整本书阅读，首先要让学生愿意读下去。与其一开始就给出标准答案，不如从一个真实的问题出发。</p><h3>从问题进入文本</h3><p>读前设问、读中记录、读后表达。把阅读过程中的发现留下来，让理解有迹可循。</p></article>`;}
 function miniBody(page){const content={home:miniHome,search:miniSearch,products:miniProducts,product:()=>miniProduct(false),book:()=>miniProduct(true),learning:miniLearning,learn:miniLearn,papers:miniPapers,paper:miniPaper,membership:miniMember,orders:miniOrders,order:()=>miniOrder(false),confirm:()=>miniOrder(true),logistics:miniLogistics,addresses:()=>miniAddress(false),'address-edit':()=>miniAddress(true),aftersale:()=>miniAftersale(false),'aftersale-detail':()=>miniAftersale(true),distribution:()=>miniDistribution(false),withdrawal:()=>miniDistribution(true),profile:miniProfile,login:miniLogin,article:miniArticle};return shared.viewState==='normal'?(content[page]||miniHome)():`<section class="ls-minicard">${stateBox('mini')}</section>`;}
 function miniFooter(page){if(['home','learning','orders','profile'].includes(page))return `<nav class="ls-mini-bottom" aria-label="小程序主导航">${[['home','首页','house'],['learning','学习','book-open'],['orders','订单','shopping-bag'],['profile','我的','user-round']].map(v=>`<button type="button" class="cursor-interaction ${page===v[0]?'active':''}" data-action="mini:${v[0]}" ${page===v[0]?'aria-current="page"':''}>${icon(v[2])}${v[1]}</button>`).join('')}</nav>`;const actions={product:['¥128.00','立即购买','mini:confirm'],book:['¥68.00','立即购买','mini:confirm'],membership:[shared.selection==='半年'?'¥99.00':'¥169.00','确认续费','mini:confirm'],confirm:['¥'+purchaseInfo()[1],'提交订单','submit-order'],paper:['','查看会员权益','mini:membership'],addresses:['','新增地址','mini:address-edit'],'address-edit':['','保存地址','save-address'],aftersale:['','提交申请','mini:aftersale-detail'],withdrawal:['','确认提现','confirm-withdrawal']};if(!actions[page])return '';const [price,text,action]=actions[page];return `<div class="ls-bottom-action">${price?`<span class="ls-price">${price}</span>`:''}${btn(text,action,'primary',shared.viewState!=='normal'?'disabled':'')}</div>`;}
 function miniRender(){const page=miniPages.find(v=>v[0]===shared.page)||miniPages[0];return `<div class="ls-mobile-stage"><div class="ls-phone"><div class="ls-statusbar"><span>9:41</span><span>••• ▰</span></div><header class="ls-mini-header"><div class="ls-row">${page[0]==='home'?'<div class="ls-brandmark" style="width:27px;height:27px;font-size:18px">山</div>':btn(icon('chevron-left'),'mini:home','link','aria-label="返回首页"')}<strong>${page[0]==='home'?'力山学堂':page[1]}</strong></div><div class="ls-wechat-capsule" aria-label="微信小程序菜单">••• <span style="opacity:.3">│</span> ◉</div></header><main class="ls-mini-main">${miniBody(page[0])}</main>${miniFooter(page[0])}</div></div>`;}
 function saveState(){window.openai?.setWidgetState?.({modelContent:{platform:shared.platform,page:shared.page,state:shared.viewState},privateContent:{selection:shared.selection}})?.catch(()=>{});}
 function render(){const pages=shared.platform==='admin'?adminPages:miniPages;if(!pages.some(v=>v[0]===shared.page))shared.page=shared.platform==='admin'?'courses':'home';picker.innerHTML=pages.map(v=>`<option value="${v[0]}" ${v[0]===shared.page?'selected':''}>${v[1]}</option>`).join('');root.querySelectorAll('[data-platform]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.platform===shared.platform)));statePicker.value=shared.viewState;stage.innerHTML=shared.platform==='admin'?adminRender():miniRender();if(globalThis.lucide)lucide.createIcons({root,attrs:{width:18,height:18}});}
 function toast(message){const el=root.querySelector('#ls-toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true;},2800);}
 function modal(title,body,action='save',label='确认'){stage.insertAdjacentHTML('beforeend',`<div class="ls-modalback"><section class="ls-modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="ls-between"><h2>${title}</h2>${btn('关闭','close-modal','link')}</div>${body}<div class="ls-row" style="justify-content:flex-end">${btn('取消','close-modal')}${btn(label,action,'primary')}</div></section></div>`);}
 root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;if(button.dataset.platform){shared.platform=button.dataset.platform;shared.page=shared.platform==='admin'?'courses':'home';shared.viewState='normal';shared.filter='全部';render();saveState();return;}if(button.dataset.plan){shared.selection=button.dataset.plan;render();saveState();return;}const action=button.dataset.action;if(!action)return;
  if(action.startsWith('mini:')||action.startsWith('admin:')){const [platform,page]=action.split(':');if(page==='confirm')shared.purchase=shared.page==='product'?'course':shared.page==='membership'?'member':'book';shared.platform=platform;shared.page=page;shared.viewState='normal';shared.filter='全部';render();saveState();return;}
  if(action==='restore'){shared.viewState='normal';if(shared.page==='users')shared.page='dashboard';render();saveState();return;}
  if(action==='filter'){const selected=root.querySelector('[data-filter="status"]');shared.filter=selected?.value||'全部';render();toast('已应用筛选');return;}
  if(action==='reset'){shared.filter='全部';render();return;}
  if(action==='learning-filter'||action==='order-filter'){button.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');toast('已切换至'+button.textContent);return;}
  if(action==='search-results'){const value=root.querySelector('#ls-search-input')?.value.trim();if(!value){toast('请输入搜索关键词');return;}shared.page='products';render();toast('搜索：'+value);return;}
  if(action==='wechat-login'){if(!root.querySelector('#ls-agree').checked){toast('请先阅读并同意协议');return;}shared.page='profile';render();saveState();return;}
  if(action==='qty-plus'||action==='qty-minus'){const q=root.querySelector('#ls-qty');q.textContent=String(Math.max(1,Math.min(99,Number(q.textContent)+(action==='qty-plus'?1:-1))));return;}
  if(action==='close-modal'){root.querySelector('.ls-modalback')?.remove();return;}
  if(action==='ship'){modal('填写发货信息',select('快递公司',['请选择快递公司','顺丰速运','中通快递'])+field('运单号','','text','输入真实运单号'),'save','确认发货');return;}
  if(action==='aftersale-review'){modal('审核售后申请','<div class="ls-note warning">退款会影响订单、权益与佣金。确认前需读取服务端影响预览。</div>'+field('商品退款（元）','68.00')+field('运费退款（元）','0.00'),'save','确认处理');return;}
  if(action==='confirm-withdrawal'){modal('确认提现','<p>提现至微信商家转账渠道，申请后按原单追踪结果。</p>'+field('提现金额（元）','100.00'),'save','确认申请');return;}
  if(action==='publish'){modal('发布确认','<p>发布后用户端将展示本次内容。请确认封面、价格、有效期和附件权限。</p>','save','确认发布');return;}
  if(action==='inventory-adjust'){modal('调整图书库存',field('调整数量','0','number')+field('调整原因','','text','填写本次调整原因'),'save','保存调整');return;}
  if(action==='member-detail'){modal('会员权益','<dl class="ls-detailpairs"><div><dt>会员级别</dt><dd>标准试卷会员</dd></div><div><dt>有效期</dt><dd>2026-10-07 至 2027-04-07</dd></div></dl><div class="ls-note">仅展示当前权益，不生成不存在的购买/续费事件。</div>','close-modal','返回');return;}
  if(action==='audit-detail'){modal('变更明细','<p>课程：现代文阅读专题课</p><dl class="ls-detailpairs"><div><dt>变更前有效期</dt><dd>180 天</dd></div><div><dt>变更后有效期</dt><dd>365 天</dd></div></dl>','close-modal','返回');return;}
  if(action==='save'||action==='save-address'){root.querySelector('.ls-modalback')?.remove();toast('预览已保存，本次为设计交互示例');return;}
  if(action==='submit-order'){const [name,price]=purchaseInfo();modal('确认订单',`<p>商品：${name} × 1</p><p>实付金额：¥${price}</p><small>设计预览不发起付款。</small>`,'close-modal','返回');return;}
  if(action==='play'){button.innerHTML=icon('pause');toast('展示播放状态，预览不加载真实视频');return;}
  if(action==='share'){modal('分享课程','<p>将课程分享给朋友，归因以服务端规则为准。</p>'+btn('分享给微信好友','close-modal','soft'),'close-modal','返回');return;}
  if(['chapter-edit','category-edit','plan-edit','module-edit','distribution-rule','new-export'].includes(action)){const labels={'chapter-edit':'编辑课程章节','category-edit':'编辑分类','plan-edit':'编辑会员套餐','module-edit':'配置首页模块','distribution-rule':'商品佣金规则','new-export':'新建导出任务'};modal(labels[action],field('名称','','text','填写名称')+select('状态',['已启用','已停用']),'save','保存');return;}
  toast({'download':'设计预览不下载真实文件','preview':'展示文件预览入口，每次操作重新校验权限','copy':'运单号复制交互示例','query-transfer':'查询原单，不重复发起转账','refresh':'已刷新示例内容','service':'联系客服入口','upload':'素材上传交互示例'}[action]||'已选择此操作');
 });
 picker.addEventListener('change',()=>{shared.page=picker.value;shared.viewState='normal';shared.filter='全部';render();saveState();});statePicker.addEventListener('change',()=>{shared.viewState=statePicker.value;render();saveState();});
 window.addEventListener('openai:set_globals',event=>{const model=event.detail?.globals?.widgetState?.modelContent;if(model&&['mini','admin'].includes(model.platform)){shared.platform=model.platform;shared.page=model.page;shared.viewState=model.state||'normal';render();}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--ls-radius',shared.radius+'px');root.style.setProperty('--ls-gap',shared.density+'px');}});tweak.addSlider(shared,'radius',{label:'卡片圆角',min:6,max:18,step:2,unit:'px',reference:'--ls-radius'});tweak.addSlider(shared,'density',{label:'后台内容留白',min:16,max:30,step:2,unit:'px',reference:'--ls-gap'});}
})();
</script>
